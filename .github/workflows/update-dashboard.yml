name: Actualizar dashboard mensual

on:
  schedule:
    # Corre a las 06:00 UTC (00:00 hora Ciudad de México aprox.) el día 1 de cada mes
    - cron: "0 6 1 * *"
  workflow_dispatch: {}  # permite correrlo manualmente desde el botón "Run workflow"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr el screener y generar el dashboard
        run: python screener.py

      - name: Publicar los cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html equity_screener_results.csv
          git diff --quiet --cached || git commit -m "Actualización automática mensual del dashboard"
          git push
